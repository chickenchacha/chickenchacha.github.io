<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치킨차차 역사인물게임 v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#eaf1e6;
    --bg2:#f6e9c3;
    --surface:#fdfbf2;
    --surface2:#f2ecd6;
    --ink:#20303a;
    --ink-soft:#5c6b62;
    --accent:#c9432a;
    --accent-dark:#9c3220;
    --accent2:#1f7a66;
    --gold:#e3a93d;
    --tile-gold:#e8b53f;
    --border:#ddd0a9;
    --shadow: 0 6px 18px rgba(32,48,58,0.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#141f26;
      --bg2:#22323a;
      --surface:#1d2b32;
      --surface2:#26383f;
      --ink:#ede7d6;
      --ink-soft:#a9b8b0;
      --accent:#ff6e4e;
      --accent-dark:#d9502f;
      --accent2:#3fbfa0;
      --gold:#f2c463;
      --tile-gold:#f0c052;
      --border:#3a4c53;
      --shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg1:#141f26;
    --bg2:#22323a;
    --surface:#1d2b32;
    --surface2:#26383f;
    --ink:#ede7d6;
    --ink-soft:#a9b8b0;
    --accent:#ff6e4e;
    --accent-dark:#d9502f;
    --accent2:#3fbfa0;
    --gold:#f2c463;
    --tile-gold:#f0c052;
    --border:#3a4c53;
    --shadow: 0 6px 20px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    font-family:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3{margin:0;font-family:"Do Hyeon","Malgun Gothic",sans-serif;font-weight:400;text-wrap:balance;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    padding:10px 18px;
    font-size:16px;
    font-weight:bold;
    box-shadow:0 3px 0 var(--accent-dark);
    transition:transform .08s;
  }
  button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark);}
  button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  button.secondary{background:#8a8a8a;box-shadow:0 3px 0 #5f5f5f;}
  button.toggle{background:var(--surface);color:var(--ink);border:2px solid var(--border);box-shadow:none;}
  button.toggle.active{background:var(--accent);color:#fff;border-color:var(--accent-dark);}

  /* ---------- Setup screen ---------- */
  #setup{
    max-width:760px;margin:0 auto;padding:28px 20px 60px;
  }
  .title-wrap{text-align:center;margin-bottom:18px;}
  .title-wrap h1{font-size:36px;color:var(--accent-dark);letter-spacing:.5px;}
  .title-wrap p{color:var(--ink-soft);margin-top:8px;font-size:14px;}
  .title-wrap .verline{
    margin-top:10px;font-size:12px;
    display:inline-block;padding:5px 12px;border-radius:999px;
    background:var(--surface2);border:1px solid var(--border);
  }
  .title-wrap .verline a{color:var(--accent-dark);font-weight:bold;}
  .setup-card{
    background:var(--surface);border-radius:18px;box-shadow:var(--shadow);
    padding:20px 22px;margin-bottom:18px;border:1px solid var(--border);
  }
  .setup-card h3{font-size:17px;margin-bottom:10px;color:var(--accent-dark);font-family:"Do Hyeon","Malgun Gothic",sans-serif;font-weight:400;}
  .hint{margin:10px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .player-row{
    display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--border);
  }
  .player-row:last-child{border-bottom:none;}
  .swatch{width:28px;height:28px;border-radius:50%;flex-shrink:0;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--border);}
  .player-row input[type=text]{
    flex:1;min-width:80px;padding:8px 10px;border-radius:8px;border:2px solid var(--border);font-size:15px;
    background:var(--surface);color:var(--ink);font-family:inherit;
  }
  .tail-toggle{display:flex;gap:6px;}
  .tail-toggle button{padding:6px 12px;font-size:14px;}
  .char-preview{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;
  }
  .char-chip{
    border-radius:10px;overflow:hidden;background:var(--surface2);
    box-shadow:0 0 0 1px var(--border);
  }
  .char-chip img{width:100%;display:block;}
  .start-row{
    display:flex;gap:10px;justify-content:center;align-items:center;
    flex-wrap:wrap;margin-top:12px;
  }
  #startBtn{font-size:19px;padding:14px 40px;}
  #rulesBtn{font-size:15px;padding:13px 22px;}

  /* ---------- 게임 설명 (책처럼 넘겨 보는 화면) ---------- */
  #rules{display:none;max-width:720px;margin:0 auto;padding:28px 20px 60px;}
  #rules.on{display:block;}
  .rule-book{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;
    box-shadow:var(--shadow);padding:24px 26px;
    min-height:390px;display:flex;flex-direction:column;
  }
  .rule-step{
    font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:bold;
  }
  .rule-book h2{
    font-size:25px;margin:6px 0 16px;color:var(--accent-dark);
  }
  .rule-body{flex:1;font-size:15px;line-height:1.8;}
  .rule-body p{margin:0 0 12px;}
  .rule-body ul{margin:0 0 12px;padding-left:20px;}
  .rule-body li{margin-bottom:9px;}
  .rule-body b{color:var(--accent-dark);}
  .rule-tip{
    background:var(--surface2);border-left:4px solid var(--gold);
    border-radius:8px;padding:11px 14px;font-size:14px;line-height:1.65;
  }
  .rule-nav{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-top:20px;flex-wrap:wrap;
  }
  .rule-dots{display:flex;gap:7px;align-items:center;}
  .rule-dot{
    width:9px;height:9px;border-radius:50%;background:var(--border);
    transition:background .2s, transform .2s;
  }
  .rule-dot.on{background:var(--accent);transform:scale(1.25);}
  .rule-pageno{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .rule-nav button{padding:9px 16px;font-size:14px;}
  #rulesBack{display:block;margin:16px auto 0;}

  /* ---------- 상단 제목 줄 (게임설명 · 제목 · 인물설명) ---------- */
  .title-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;
  }
  .title-head .titles{flex:1 1 240px;}
  .topbtn{
    background:var(--surface);color:var(--accent-dark);
    border:2px solid var(--accent);box-shadow:none;
    padding:10px 14px;font-size:14px;white-space:nowrap;
  }
  .topbtn:hover{background:var(--accent);color:#fff;}

  /* ---------- 인물 설명 화면 ---------- */
  #chars{display:none;max-width:720px;margin:0 auto;padding:28px 20px 60px;}
  #chars.on{display:block;}
  .char-top{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .char-top img{
    width:130px;height:130px;flex-shrink:0;object-fit:contain;
    border-radius:14px;border:2px solid var(--border);background:#fff;padding:4px;
  }
  .char-top h2{margin:4px 0 0;font-size:26px;color:var(--accent-dark);}
  #charsBack{display:block;margin:16px auto 0;}
  @media (max-width:480px){
    .char-top{flex-direction:column;text-align:center;gap:10px;}
  }

  /* ---------- Game screen ---------- */
  #game{display:none;}
  #game.on{
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
  }
  body.playing{overflow:hidden;}
  #topbar{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:12px 18px;gap:12px;flex-wrap:wrap;
  }
  #playerList{display:flex;gap:10px;flex-wrap:wrap;}
  .player-badge{
    display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;
    padding:8px 12px;box-shadow:var(--shadow);opacity:.55;transform:scale(.94);
    transition:all .25s;border:3px solid transparent;color:var(--ink);
  }
  .player-badge.active{
    opacity:1;transform:scale(1.06);border-color:var(--accent);
  }
  .player-badge .dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;}
  .player-badge .pname{font-weight:bold;font-size:14px;}
  .player-badge .ptails{font-size:13px;color:var(--ink-soft);}

  #turnIndicator{
    background:var(--accent);color:#fff;border-radius:16px;padding:12px 20px;
    box-shadow:var(--shadow);text-align:right;min-width:170px;
  }
  #turnIndicator .label{font-size:12px;opacity:.85;}
  #turnIndicator .name{font-size:21px;font-weight:400;font-family:"Do Hyeon","Malgun Gothic",sans-serif;}
  #turnSide{display:flex;align-items:center;gap:10px;}
  #restartBtn{padding:8px 14px;font-size:13px;}
  #statusMsg{
    text-align:center;font-size:15px;min-height:20px;color:var(--accent-dark);font-weight:bold;
    padding:0 10px 4px;
  }

  #boardWrap{
    flex:1;min-height:0;
    display:flex;justify-content:center;align-items:center;
    padding:2px 8px 8px;
  }
  #board{
    position:relative;width:100%;height:100%;
  }
  #trackShape{
    position:absolute;inset:0;
    background:var(--surface2);
    box-shadow: inset 0 0 0 2px var(--border);
  }
  #trackHole{
    position:absolute;background:var(--bg1);
  }
  .egg{
    position:absolute;
    width:var(--egg-w,98px);height:var(--egg-h,70px);
    margin-left:calc(var(--egg-w,98px) / -2);
    margin-top:calc(var(--egg-h,70px) / -2);
    border-radius:50%;
    background:#fff;border:var(--egg-bw,3px) solid var(--tile-gold);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    box-shadow:0 3px 6px rgba(32,48,58,0.16);
    transition:box-shadow .3s, transform .3s;
  }
  /* v3: 사진이 정사각형이고 이름이 사진 아래쪽에 박혀 있다.
     조금이라도 확대하면 이름이 잘려 나가므로 확대 없이 그대로 채운다. */
  .egg img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  /* 스마트폰 모드: 그림 대신 이름만 (타일을 작게 줄이기 위해)
     타일 배경은 테마와 무관하게 항상 흰색이므로 글자색도 고정 진회색으로 둔다.
     (--ink 를 쓰면 다크 모드에서 흰 배경에 밝은 글자가 되어 안 보임) */
  .egg .egg-name{
    font-family:"Do Hyeon","Malgun Gothic",sans-serif;
    font-size:var(--egg-font,13px);line-height:1.15;
    color:#1b2a33;text-align:center;
    padding:0 3px;word-break:keep-all;
  }
  .egg.target{
    border-color:var(--gold);
    box-shadow:0 0 0 4px var(--gold), 0 0 18px 6px rgba(227,169,61,0.7);
    transform:scale(1.16);
    z-index:5;
  }
  .chick{
    position:absolute;
    width:var(--chick-d,30px);height:var(--chick-d,30px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--chick-d,30px) * .5);
    border:3px solid var(--surface);box-shadow:0 2px 5px rgba(32,48,58,0.35);
    transition:left .4s ease, top .4s ease, transform .3s, opacity .3s;
    z-index:6;
  }
  .chick .feathers{
    position:absolute;top:calc(var(--chick-d,30px) * -.34);right:-6px;
    font-size:calc(var(--chick-d,30px) * .37);
  }

  #center{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:var(--center-w,380px);
    display:grid;
    grid-template-columns:repeat(var(--cols,4),1fr);
    gap:var(--oct-gap,10px);
  }
  .oct{
    aspect-ratio:1/1;width:100%;
    clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:#fff;
    transition:transform .15s, background .2s;
    position:relative;
  }
  .oct:hover:not(.flipped){transform:scale(1.08);filter:brightness(1.08);}
  .octnum{
    font-family:"Do Hyeon","Malgun Gothic",sans-serif;
    font-size:var(--octnum-size,30px);line-height:1;
    text-shadow:0 2px 3px rgba(0,0,0,0.35);
    font-variant-numeric:tabular-nums;
  }
  /* 뒤집힌 면: 바깥 8각형은 노란 테두리, 안쪽 8각형에 인물 그림 */
  .oct.flipped{
    background:var(--tile-gold);
  }
  .oct-face{
    position:absolute;inset:4px;
    clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    background:#fff;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .oct-face img{width:100%;height:100%;object-fit:cover;}
  .oct.wrong{animation:shake .4s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }
  .oct.correct{animation:pop .4s;}
  @keyframes pop{
    0%{transform:scale(1);}
    50%{transform:scale(1.25);}
    100%{transform:scale(1);}
  }

  #winOverlay{
    display:none;position:fixed;inset:0;background:rgba(20,31,38,0.6);
    align-items:center;justify-content:center;z-index:50;
  }
  #winCard{
    background:var(--surface);border-radius:20px;padding:36px 44px;text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);border:1px solid var(--border);
  }
  #winCard h2{font-size:26px;color:var(--accent-dark);margin-bottom:10px;font-weight:400;}
  #winCard .trophy{font-size:56px;}
  #resetBtn{margin-top:18px;}

  /* 스마트폰 모드: 상단 정보 영역을 작게 줄여 보드에 공간을 넘김 */
  #game.mobile #topbar{padding:6px 8px 4px;gap:6px;}
  #game.mobile #playerList{gap:6px;}
  #game.mobile .player-badge{
    padding:4px 8px;gap:6px;border-width:2px;border-radius:10px;
  }
  #game.mobile .player-badge .dot{width:11px;height:11px;}
  #game.mobile .player-badge .pname{font-size:11px;}
  #game.mobile .player-badge .ptails{font-size:10px;}
  #game.mobile #turnSide{gap:6px;}
  #game.mobile #turnIndicator{
    padding:5px 12px;min-width:0;border-radius:10px;
  }
  #game.mobile #turnIndicator .label{font-size:9px;}
  #game.mobile #turnIndicator .name{font-size:15px;}
  #game.mobile #restartBtn{padding:5px 9px;font-size:11px;border-radius:9px;}
  #game.mobile #statusMsg{font-size:11.5px;min-height:16px;padding:0 8px 2px;}

  @media (max-width:600px){
    #game:not(.mobile) #topbar{flex-direction:column;align-items:stretch;}
    #game:not(.mobile) #turnIndicator{text-align:center;}
  }
</style>
</head>
<body>

<!-- ============ SETUP SCREEN ============ -->
<div id="setup">
  <div class="title-wrap">
    <div class="title-head">
      <button class="topbtn" id="rulesBtn">📖 게임설명</button>
      <div class="titles">
        <h1>🐔 치킨차차 역사인물게임</h1>
        <p>우리 역사 속 위인 12명과 함께하는 달걀 뒤집기 추격 게임!</p>
      </div>
      <button class="topbtn" id="charsBtn">👤 인물설명</button>
    </div>
    <p class="verline">버전 3 · 실제 인물 사진 12명 &nbsp;|&nbsp; <a href="../">버전 1</a> &nbsp;·&nbsp; <a href="../v2/">버전 2</a></p>
  </div>

  <div class="setup-card">
    <h3>1. 어떤 기기로 하나요?</h3>
    <div class="row" id="deviceRow"></div>
    <p class="hint" id="deviceHint"></p>
  </div>

  <div class="setup-card">
    <h3>2. 참가 인원 선택</h3>
    <div class="row" id="playerCountRow"></div>
  </div>

  <div class="setup-card">
    <h3>3. 플레이어 색상 &amp; 꽁지(깃털) 개수 설정</h3>
    <div id="playerConfigList"></div>
  </div>

  <div class="setup-card">
    <h3>4. 등장 인물 미리보기</h3>
    <div class="char-preview" id="charPreview"></div>
  </div>

  <div class="start-row">
    <button id="startBtn">게임 시작 ▶</button>
  </div>
</div>

<!-- ============ RULES SCREEN ============ -->
<div id="rules">
  <div class="title-wrap">
    <h1>📖 게임 방법</h1>
  </div>
  <div class="rule-book">
    <div class="rule-step" id="ruleStep"></div>
    <h2 id="ruleTitle"></h2>
    <div class="rule-body" id="ruleBody"></div>
    <div class="rule-nav">
      <button class="secondary" id="rulePrev">◀ 이전</button>
      <div class="rule-dots" id="ruleDots"></div>
      <span class="rule-pageno" id="rulePageNo"></span>
      <button id="ruleNext">다음 ▶</button>
    </div>
  </div>
  <button class="secondary" id="rulesBack">시작화면으로 돌아가기</button>
</div>

<!-- ============ CHARACTERS SCREEN ============ -->
<div id="chars">
  <div class="title-wrap">
    <h1>👤 인물 설명</h1>
  </div>
  <div class="rule-book">
    <div class="char-top">
      <img id="charImg" alt="">
      <div>
        <div class="rule-step" id="charEra"></div>
        <h2 id="charName"></h2>
      </div>
    </div>
    <div class="rule-body" id="charBody"></div>
    <div class="rule-nav">
      <button class="secondary" id="charPrev">◀ 이전</button>
      <div class="rule-dots" id="charDots"></div>
      <span class="rule-pageno" id="charPageNo"></span>
      <button id="charNext">다음 ▶</button>
    </div>
  </div>
  <button class="secondary" id="charsBack">시작화면으로 돌아가기</button>
</div>

<!-- ============ GAME SCREEN ============ -->
<div id="game">
  <div id="topbar">
    <div id="playerList"></div>
    <div id="turnSide">
      <button class="secondary" id="restartBtn">처음부터 다시 설정</button>
      <div id="turnIndicator">
        <div class="label">지금은 누구 차례?</div>
        <div class="name" id="turnName">-</div>
      </div>
    </div>
  </div>
  <div id="statusMsg"></div>

  <div id="boardWrap">
    <div id="board">
      <div id="trackShape"></div>
      <div id="trackHole"></div>
      <div id="eggLayer"></div>
      <div id="center"></div>
      <div id="chickLayer"></div>
    </div>
  </div>
</div>

<div id="winOverlay">
  <div id="winCard">
    <div class="trophy">🏆</div>
    <h2 id="winText"></h2>
    <button id="resetBtn">새 게임 시작</button>
  </div>
</div>

<script>

/* ================= 유틸 ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function charById(id){ return CHARACTERS[id]; }

/* ================= 게임 초기화 ================= */
function buildInitialState(){
  const n = setupConfig.count;
  const names = [];
  for(let i=0;i<n;i++){
    const inp = document.getElementById('pname-'+i);
    names.push((inp && inp.value.trim()) || ('플레이어 '+(i+1)));
  }

  // 24개 달걀 타일: 12인물 * 2 랜덤 배치
  const eggCharIds = shuffle(CHARACTERS.flatMap(c=>[c.id,c.id]));
  const eggTiles = eggCharIds.map(cid=>({ charId: cid, occupiedBy: null }));

  // 중앙 팔각형 타일: 12개, 인물별로 1장씩, 뒤집혀 있음 (맞춰도 제자리에 다시 엎어둠)
  const centerCharIds = shuffle(CHARACTERS.map(c=>c.id));
  const centerTiles = centerCharIds.map(cid=>({ charId: cid, revealed:false }));

  // 플레이어 시작 위치: 균등 분산
  const players = [];
  for(let i=0;i<n;i++){
    const pos = Math.round(i * NUM_EGG_TILES / n) % NUM_EGG_TILES;
    players.push({
      idx:i, name:names[i], color:PLAYER_COLORS[i],
      tails:setupConfig.tails[i], position:pos
    });
  }
  // 위치 충돌 방지(이론상 없음, 안전차원)
  const used = new Set();
  players.forEach(p=>{
    while(used.has(p.position)) p.position=(p.position+1)%NUM_EGG_TILES;
    used.add(p.position);
    eggTiles[p.position].occupiedBy = p.idx;
  });

  const totalTails = players.reduce((s,p)=>s+p.tails,0);

  return {
    players, eggTiles, centerTiles,
    currentPlayerIndex:0,
    locked:false,
    totalTails,
    winnerIdx:null
  };
}

function startGame(){
  state = buildInitialState();
  setStatus('');
  document.getElementById('setup').style.display='none';
  const gameEl = document.getElementById('game');
  gameEl.classList.add('on');
  gameEl.classList.toggle('mobile', setupConfig.device === 'mobile');
  document.body.classList.add('playing');
  // 상단바를 먼저 채워 높이를 확정한 뒤에 보드 좌표를 계산해야 한다.
  // (반대 순서면 보드가 나중에 줄어들어 아래쪽 타일이 화면 밖으로 밀려남)
  renderAll();
  relayoutBoard();
  observeBoardSize();
}

// 보드 안쪽만 다시 그린다 — 상단바를 건드리지 않으므로 크기 변화 루프가 생기지 않음
function relayoutBoard(){
  if(!state) return;
  layoutBoard();
  renderEggs();
  renderCenter();
  renderChicks();
}

let boardRO = null, lastBoardSize = '';
function observeBoardSize(){
  if(boardRO || typeof ResizeObserver === 'undefined') return;
  boardRO = new ResizeObserver(entries=>{
    const r = entries[0].contentRect;
    const key = Math.round(r.width)+'x'+Math.round(r.height);
    if(key === lastBoardSize) return;
    lastBoardSize = key;
    relayoutBoard();
  });
  boardRO.observe(document.getElementById('board'));
}

function leaveGame(){
  document.getElementById('game').classList.remove('on');
  document.body.classList.remove('playing');
  document.getElementById('setup').style.display='block';
}

/* ================= 좌표 계산 ================= */
let eggPositionsPx = [];

// 타원 둘레를 "각도" 기준이 아니라 "호의 길이" 기준으로 균등 분할
// (가로로 넓은 타원은 각도 균등 분할 시 양쪽 끝에 타일이 몰리는 문제가 있음)
function ellipseEvenPoints(rx, ry, n){
  const N = 1440;
  const startAngle = -Math.PI/2;
  const pts = [];
  for(let k=0;k<=N;k++){
    const t = startAngle + (k/N)*Math.PI*2;
    pts.push({x: rx*Math.cos(t), y: ry*Math.sin(t)});
  }
  const cum = [0];
  for(let k=1;k<=N;k++){
    const dx = pts[k].x-pts[k-1].x, dy = pts[k].y-pts[k-1].y;
    cum.push(cum[k-1]+Math.hypot(dx,dy));
  }
  const total = cum[N];
  const result = [];
  let seg = 0;
  for(let i=0;i<n;i++){
    const target = (i/n)*total;
    while(seg<N-1 && cum[seg+1]<target) seg++;
    const segLen = (cum[seg+1]-cum[seg]) || 1;
    const frac = (target-cum[seg])/segLen;
    const p0=pts[seg], p1=pts[seg+1];
    result.push({
      x: p0.x + (p1.x-p0.x)*frac,
      y: p0.y + (p1.y-p0.y)*frac
    });
  }
  return result;
}

// 타원 둘레 길이(라마누잔 근사) — 타일 크기를 둘레에 맞춰 정하는 데 사용
function ellipsePerimeter(a,b){
  const h3 = 3*Math.pow(a-b,2)/Math.pow(a+b,2);
  return Math.PI*(a+b)*(1 + h3/(10+Math.sqrt(4-h3)));
}

function layoutBoard(){
  const board = document.getElementById('board');
  const root = document.documentElement;
  const sp = spec();
  const wAll = board.clientWidth, hAll = board.clientHeight;
  if(!wAll || !hAll) return;

  // 0) 화면이 아주 넓어도 트랙이 지나치게 납작해지지 않도록 가로 폭을 제한하고
  //    남는 공간은 좌우 여백으로 돌린다.
  const w = Math.min(wAll, hAll * sp.maxAspect);
  const h = hAll;
  const ox = (wAll - w) / 2;

  // 1) 달걀 타일 크기 = 트랙 둘레의 1/24 에 맞춘다. 이것이 화면 크기에 따라
  //    전체 크기를 결정하는 하나의 기준값이 된다.
  //    세로로 긴 타원에서는 옆면 타일이 위아래로 늘어서므로 "긴 쪽 변"을 기준으로 비교한다.
  const longSide = Math.max(1, sp.ratio);
  let eggW = Math.min(sp.maxEggW, w * 0.09);
  for(let i=0;i<5;i++){
    const eh = eggW * sp.ratio;
    const rxT = Math.max(50, w/2 - eggW/2 - 2);
    const ryT = Math.max(50, h/2 - eh/2 - 2);
    const spacing = ellipsePerimeter(rxT, ryT) / NUM_EGG_TILES;
    eggW = Math.min(sp.maxEggW, (spacing * 0.94) / longSide);
  }
  eggW = Math.round(Math.max(sp.minEggW, eggW));
  const eggH = Math.round(eggW * sp.ratio);

  // 2) 트랙 반지름: 타일이 보드 밖으로 나가지 않도록 안쪽으로 물림
  const rx = Math.max(50, w/2 - eggW/2 - 2);
  const ry = Math.max(50, h/2 - eggH/2 - 2);

  const cx = ox + w/2, cy = h/2;
  eggPositionsPx = ellipseEvenPoints(rx, ry, NUM_EGG_TILES)
    .map(p=>({x: cx+p.x, y: cy+p.y}));

  // 3) 팔각형 타일은 달걀 타일 크기에 "비례"시킨다. 남는 공간을 채우게 두면
  //    창 크기에 따라 두 타일의 크기 균형이 제각각으로 흐트러진다.
  //    안쪽 공간이 모자랄 때만 그만큼 줄인다.
  const gap = Math.max(6, Math.round(eggW*0.11));
  const innerW = 2*rx - eggW - 16;
  const innerH = 2*ry - eggH - 16;
  let oct = eggW * sp.octRatio;
  oct = Math.min(
    oct,
    (innerW - (sp.cols-1)*gap) / sp.cols,
    (innerH - (sp.rows-1)*gap) / sp.rows
  );
  oct = Math.max(28, Math.floor(oct));
  const centerW = oct*sp.cols + gap*(sp.cols-1);

  // 4) CSS 변수로 전달
  root.style.setProperty('--egg-w', eggW+'px');
  root.style.setProperty('--egg-h', eggH+'px');
  root.style.setProperty('--egg-bw', (eggW<70 ? 2 : 3)+'px');
  root.style.setProperty('--egg-font', Math.max(9, Math.round(eggW*0.175))+'px');
  root.style.setProperty('--cols', sp.cols);
  root.style.setProperty('--oct-gap', gap+'px');
  root.style.setProperty('--center-w', Math.round(centerW)+'px');
  root.style.setProperty('--octnum-size', Math.round(oct*0.42)+'px');
  root.style.setProperty('--chick-d', Math.max(20, Math.round(eggW*0.31))+'px');

  // 5) 트랙 띠 그리기 (바깥 타원 - 안쪽 구멍)
  const shape = document.getElementById('trackShape');
  const hole = document.getElementById('trackHole');
  if(shape){
    shape.style.left = ox+'px';
    shape.style.top = '0px';
    shape.style.right = 'auto';
    shape.style.bottom = 'auto';
    shape.style.width = w+'px';
    shape.style.height = h+'px';
    shape.style.borderRadius = '50%';
  }
  if(hole){
    const insetX = eggW*0.55 + 6, insetY = eggH*0.55 + 6;
    hole.style.left = (ox + insetX)+'px';
    hole.style.top = insetY+'px';
    hole.style.right = 'auto';
    hole.style.bottom = 'auto';
    hole.style.width = Math.max(0, w - 2*insetX)+'px';
    hole.style.height = Math.max(0, h - 2*insetY)+'px';
    hole.style.borderRadius = '50%';
  }
}

/* ================= 목표 타일 계산 ================= */
function getTarget(playerIdx){
  const start = state.players[playerIdx].position;
  let pos = (start+1) % NUM_EGG_TILES;
  const passed = [];
  let guard=0;
  while(state.eggTiles[pos].occupiedBy !== null && guard < NUM_EGG_TILES){
    passed.push(state.eggTiles[pos].occupiedBy);
    pos = (pos+1) % NUM_EGG_TILES;
    guard++;
  }
  return { pos, targetCharId: state.eggTiles[pos].charId, passed };
}

/* ================= 렌더링 ================= */
function renderAll(){
  renderPlayerList();
  renderTurnIndicator();
  renderEggs();
  renderCenter();
  renderChicks();
}

function renderPlayerList(){
  const wrap = document.getElementById('playerList');
  wrap.innerHTML = state.players.map(p=>`
    <div class="player-badge ${p.idx===state.currentPlayerIndex?'active':''}">
      <div class="dot" style="background:${p.color}"></div>
      <div>
        <div class="pname">${escapeHtml(p.name)}</div>
        <div class="ptails">🪶 x${p.tails}</div>
      </div>
    </div>
  `).join('');
}

function renderTurnIndicator(){
  const p = state.players[state.currentPlayerIndex];
  document.getElementById('turnName').textContent = p.name;
  document.getElementById('turnName').style.color = '#fff';
  document.getElementById('turnIndicator').style.background = p.color;
}

function renderEggs(){
  const layer = document.getElementById('eggLayer');
  const target = state.winnerIdx===null ? getTarget(state.currentPlayerIndex) : null;
  layer.innerHTML = state.eggTiles.map((tile,i)=>{
    const pos = eggPositionsPx[i] || {x:0,y:0};
    const c = charById(tile.charId);
    const isTarget = target && target.pos===i;
    const inner = spec().showPicture
      ? `<img src="${c.img}" alt="${c.name}">`
      : `<span class="egg-name">${c.name}</span>`;
    return `<div class="egg ${isTarget?'target':''}" style="left:${pos.x}px;top:${pos.y}px;">${inner}</div>`;
  }).join('');
}

function renderChicks(){
  const layer = document.getElementById('chickLayer');
  layer.innerHTML = state.players.map(p=>{
    const pos = eggPositionsPx[p.position] || {x:0,y:0};
    const isActive = p.idx === state.currentPlayerIndex;
    const scale = isActive ? 1.35 : 0.9;
    const opacity = isActive ? 1 : 0.55;
    const eggW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--egg-w')) || 98;
    const eggH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--egg-h')) || 70;
    return `<div class="chick" style="left:${pos.x + eggW*0.22}px;top:${pos.y - eggH*0.55}px;background:${p.color};
      transform:scale(${scale});opacity:${opacity};" title="${escapeHtml(p.name)}">
      🐥
      <span class="feathers">${'🪶'.repeat(Math.min(p.tails,4))}</span>
    </div>`;
  }).join('');
}

function renderCenter(){
  const wrap = document.getElementById('center');
  wrap.innerHTML = state.centerTiles.map((tile,i)=>{
    if(tile.revealed){
      const c = charById(tile.charId);
      return `<div class="oct flipped" data-i="${i}">
        <div class="oct-face"><img src="${c.img}" alt="${c.name}"></div>
      </div>`;
    }
    return `<div class="oct" data-i="${i}"><span class="octnum">${i+1}</span></div>`;
  }).join('');
  wrap.querySelectorAll('.oct[data-i]').forEach(el=>{
    el.addEventListener('click', onOctClick);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ================= 클릭 로직 ================= */
function setStatus(msg){
  document.getElementById('statusMsg').textContent = msg;
}

function onOctClick(e){
  if(state.locked || state.winnerIdx!==null) return;
  const i = parseInt(e.currentTarget.dataset.i,10);
  const tile = state.centerTiles[i];
  if(tile.revealed) return;

  state.locked = true;
  tile.revealed = true;
  renderCenter();

  const target = getTarget(state.currentPlayerIndex);
  const el = document.querySelector(`.oct[data-i="${i}"]`);

  if(tile.charId === target.targetCharId){
    // 정답
    if(el) el.classList.add('correct');
    const pname = state.players[state.currentPlayerIndex].name;
    setStatus(`✅ ${pname}님, ${i+1}번 정답! "${charById(tile.charId).name}" 발견! 계속 도전할 수 있어요.`);
    setTimeout(()=>{
      tile.revealed = false;
      applyMove(state.currentPlayerIndex, target);
      renderAll();
      if(state.winnerIdx!==null){
        showWin();
        return;
      }
      state.locked = false;
    }, 700);
  } else {
    // 오답
    if(el) el.classList.add('wrong');
    const pname = state.players[state.currentPlayerIndex].name;
    setStatus(`❌ ${pname}님, ${i+1}번은 "${charById(tile.charId).name}"이네요. 다음 사람 차례로 넘어갑니다.`);
    setTimeout(()=>{
      tile.revealed = false;
      state.currentPlayerIndex = (state.currentPlayerIndex+1) % state.players.length;
      renderAll();
      setStatus('');
      state.locked = false;
    }, 1100);
  }
}

function applyMove(playerIdx, target){
  const p = state.players[playerIdx];
  state.eggTiles[p.position].occupiedBy = null;
  p.position = target.pos;
  state.eggTiles[target.pos].occupiedBy = playerIdx;

  // 앞지르기: 뛰어넘은 상대의 꽁지를 모두 빼앗음
  target.passed.forEach(oppIdx=>{
    const opp = state.players[oppIdx];
    const stolen = opp.tails;
    opp.tails = 0;
    p.tails += stolen;
  });

  if(p.tails >= state.totalTails){
    state.winnerIdx = playerIdx;
  }
}

function showWin(){
  const overlay = document.getElementById('winOverlay');
  const text = document.getElementById('winText');
  const w = state.players[state.winnerIdx];
  text.textContent = `🎉 ${w.name}님 승리! 🎉 (꽁지 ${w.tails}개 모두 획득!)`;
  overlay.style.display = 'flex';
}
